services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: chatapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: chat-server
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://chatuser:chatpass@postgres:5432/chatapp
      - REDIS_URL=redis://redis:6379
      - PORT=8080
      - ALLOWED_ORIGINS=http://localhost:3000
      - ACCESS_TOKEN_SECRET=your-access-token-secret-min-32-chars
      - REFRESH_TOKEN_SECRET=your-refresh-token-secret-min-32-chars
      - ACCESS_TOKEN_EXPIRE=15m
      - REFRESH_TOKEN_EXPIRE=7d
      - IMAGEKIT_PUBLIC_KEY=your-public-key
      - IMAGEKIT_PRIVATE_KEY=your-private-key
      - IMAGEKIT_URL_ENDPOINT=https://ik.imagekit.io/your-id
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=465
      - SMTP_USER=your-email@gmail.com
      - SMTP_PASS=your-app-password
      - ENCRYPTION_KEY=your-32-byte-hex-key
      # LiveKit (audio/video calling) — leave blank to disable calling
      - LIVEKIT_URL=${LIVEKIT_URL:-}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-}
    volumes:
      - ./server/src:/app/src        # Hot-reload source code
      - ./server/prisma:/app/prisma  # Prisma schema
      - /app/node_modules            # Prevent overwriting node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
