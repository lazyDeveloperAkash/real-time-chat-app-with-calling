services:
  postgres:
    image: postgres:16-alpine
    container_name: chat-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: chatuser
      POSTGRES_PASSWORD: chatpass
      POSTGRES_DB: chatapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatuser -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: chat-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: chat-server
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://chatuser:chatpass@postgres:5432/chatapp
      REDIS_URL: redis://redis:6379
      PORT: 8080
      ALLOWED_ORIGINS: http://localhost:3000

      ACCESS_TOKEN_SECRET: your-access-token-secret-min-32-chars
      REFRESH_TOKEN_SECRET: your-refresh-token-secret-min-32-chars
      ACCESS_TOKEN_EXPIRE: 15m
      REFRESH_TOKEN_EXPIRE: 7d

      IMAGEKIT_PUBLIC_KEY: public_j/GoLIOeC8zmQM7x+V15YhW57bc=
      IMAGEKIT_PRIVATE_KEY: private_vjLUPb2z3RtFE/glcvz180r3gT0=
      IMAGEKIT_URL_ENDPOINT: https://ik.imagekit.io/xxqni4yfv

      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 465
      SMTP_USER: your-email@gmail.com
      SMTP_PASS: your-app-password

      ENCRYPTION_KEY: your-32-byte-hex-key

      LIVEKIT_URL: wss://chatly-6yxenoo0.livekit.cloud
      LIVEKIT_API_KEY: APIBC4sCrCDwwju
      LIVEKIT_API_SECRET: ZR7cnrpBN7upz37uBTU2AvUQNzDGByETyPecoAafozk

    volumes:
      - ./server/src:/app/src
      - ./server/prisma:/app/prisma
      - /app/node_modules

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis-insight:
    image: redis/redisinsight:latest
    container_name: redis-insight
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data

volumes:
  postgres_data:
  redis_data:
  redisinsight_data: